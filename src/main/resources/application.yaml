spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:secret}
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 5000
            response-timeout: 30s
          # Every service serves under /api/v1 on port 8080, so paths are forwarded unchanged.
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://auth-service:8080}
              predicates:
                - Path=/api/v1/auth/**,/api/v1/user/**,/api/v1/session/**
            - id: profile-service
              uri: ${PROFILE_SERVICE_URL:http://profile-service:8080}
              predicates:
                - Path=/api/v1/profiles/**
            - id: catalog-service
              uri: ${CATALOG_SERVICE_URL:http://catalog-service:8080}
              predicates:
                - Path=/api/v1/materials/**
            - id: metric-service
              uri: ${METRIC_SERVICE_URL:http://metric-service:8080}
              predicates:
                - Path=/api/v1/events/**,/api/v1/metrics/**
            - id: recommendation-service
              uri: ${RECOMMENDATION_SERVICE_URL:http://recommendation-service:8080}
              predicates:
                - Path=/api/v1/recommendations/**
              metadata:
                # LLM answers take seconds
                response-timeout: 120000

jwt:
  secret: ${JWT_SECRET}

app:
  security:
    # Everything else needs a valid access token.
    public-routes:
      - POST /api/v1/user
      - POST /api/v1/auth/login
      - POST /api/v1/auth/refresh
      - DELETE /api/v1/auth/logout
      - GET /api/v1/materials/**
      - GET /api/v1/metrics/**
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

logging:
  level:
    root: INFO
  file:
    name: /logs/api-gateway.log
  structured:
    format:
      file: ecs # Loki supports it
    json:
      exclude: ecs
